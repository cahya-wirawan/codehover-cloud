# Same-origin gateway for the SPA and /api. Local/pilot template; production TLS, HSTS and
# client-IP trust live at the ingress in front of this container.
# nginx does not inherit add_header into a location that declares its own add_header,
# so the security headers are repeated in every location that sets its own headers.

resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS; re-resolve api after container restarts

server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 2m;            # webhook bodies are capped at 2 MiB
 client_body_timeout 30s;
 send_timeout 60s;
 set $api_upstream http://api:8000;

 # Baseline headers (also repeated below where a location adds its own headers).
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 # style-src needs 'unsafe-inline' for CodeMirror/Mermaid injected styles unless a nonce
 # pipeline is introduced; scripts stay 'self' only. Tighten after the frontend build is validated.
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

 # Build event streams (SSE): long-lived, unbuffered.
 location ~ ^/api/v1/builds/[^/]+/events$ {
   proxy_pass $api_upstream;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Request-ID $request_id;
   proxy_buffering off;
   proxy_cache off;
   proxy_read_timeout 3600s;
 }

 # ZIP repository uploads (M6): the API takes at most 100 MiB and checks the size itself.
 location ~ ^/api/v1/projects/[^/]+/uploads$ {
   client_max_body_size 101m;
   proxy_pass $api_upstream;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Host "";
   proxy_set_header X-Forwarded-Proto "";
   proxy_set_header X-Request-ID $request_id;
   proxy_request_buffering on;
   proxy_read_timeout 120s;
   proxy_send_timeout 120s;
 }

 # OAuth discovery for MCP sign-in (RFC 8414, RFC 9728) lives at the origin's root.
 location ^~ /.well-known/oauth- {
   proxy_pass $api_upstream;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Host "";
   proxy_set_header X-Forwarded-Proto "";
   proxy_set_header X-Request-ID $request_id;
   proxy_read_timeout 10s;
 }

 location /api/ {
   proxy_pass $api_upstream;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   # The backend derives its origin from PUBLIC_ORIGIN, never from Host/X-Forwarded-* headers.
   # Overwrite (do not append) client-supplied forwarding headers.
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Host "";
   proxy_set_header X-Forwarded-Proto "";
   proxy_set_header X-Request-ID $request_id;
   proxy_buffering on;
   proxy_connect_timeout 5s;
   proxy_read_timeout 60s;
   proxy_send_timeout 60s;
 }

 # Content-hashed Vite assets: immutable.
 location /assets/ {
   try_files $uri =404;
   add_header Cache-Control "public, max-age=31536000, immutable" always;
   add_header X-Content-Type-Options nosniff always;
   add_header Referrer-Policy strict-origin-when-cross-origin always;
   add_header X-Frame-Options DENY always;
   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 }

 # SPA shell: always revalidate so a deploy is picked up immediately.
 location / {
   try_files $uri $uri/ /index.html;
   add_header Cache-Control "no-cache" always;
   add_header X-Content-Type-Options nosniff always;
   add_header Referrer-Policy strict-origin-when-cross-origin always;
   add_header X-Frame-Options DENY always;
   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 }
}
